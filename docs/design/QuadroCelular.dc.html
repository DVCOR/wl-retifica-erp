<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OS no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#111827}
a{color:#C8102E}a:hover{color:#A10E25}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F6; font-family: Inter, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column">
  <header style="background: #0E0E10; color: #FFFFFF; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; border-bottom: 3px solid #C8102E">
    <div style="display: flex; align-items: center; gap: 10px">
      <img src="/_blob/1b39e4d6b708a5dcc5aeba9e5dfb56db" alt="Logo WL Retífica" style="height: 34px; width: auto; border-radius: 6px; display: block">
      <span style="flex: 1; font-size: 16px; font-weight: 700">Ordens de serviço</span>
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #374151; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">WL</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #1F2937; border: 1px solid #374151; border-radius: 10px; padding: 0 12px; height: 44px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Busca</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input type="search" placeholder="Cliente, placa, motor ou OS" style="flex: 1; background: transparent; border: 0; color: #FFFFFF; font: inherit; font-size: 15px; outline: none">
    </label>
  </header>

  <div role="tablist" aria-label="Status" style="display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" role="tab" onClick="{{t.pick}}" aria-selected="{{t.sel}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4B5563">{{c.num}}</span>
          <span style="{{c.statusStyle}}">{{c.status}}</span>
        </div>
        <div style="font-size: 16px; font-weight: 600">{{c.cliente}}</div>
        <div style="font-size: 14px; color: #4B5563">{{c.motor}}</div>
        <div style="font-size: 13px; color: {{c.prazoColor}}; font-weight: 600">{{c.prazo}}</div>
      </article>
    </sc-for>
  </div>

  <nav aria-label="Navegação" style="display: flex; align-items: center; justify-content: space-around; background: #FFFFFF; border-top: 1px solid #E2E5EA; padding: 6px 4px 18px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 6px 0; font-size: 11px; color: #4B5563; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"></path></svg>Início</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 6px 0; font-size: 11px; color: #C8102E; font-weight: 600; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="10" rx="1"></rect><rect x="17" y="4" width="4" height="13" rx="1"></rect></svg>OS</a>
    <a href="NovaOS-Checklist.dc.html" aria-label="Nova OS" style="width: 56px; height: 56px; margin-top: -24px; border-radius: 50%; background: #C8102E; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(200,16,46,0.35)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="FichaCliente.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 6px 0; font-size: 11px; color: #4B5563; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path><circle cx="10" cy="7" r="4"></circle></svg>Clientes</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; padding: 6px 0; font-size: 11px; color: #4B5563; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>Mais</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'todas' }; }
  renderVals() {
    var self = this;
    var pill = function (fg, bg) { return 'font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: ' + fg + '; background: ' + bg + ';'; };
    var ST = {
      analise: ['Em análise', pill('#1D4ED8', '#E8EFFE')],
      orc: ['Orçamento enviado', pill('#6D28D9', '#F1EAFE')],
      exec: ['Em execução', pill('#A10E25', '#FDECEE')],
      pronto: ['Pronto', pill('#15803D', '#E7F6EC')]
    };
    var all = [
      ['OS 2026-0144', 'Oficina Exemplo A', 'MWM 4.10 diesel · cabeçote + bloco', 'analise', 'Atrasada 1 dia', true],
      ['OS 2026-0138', 'Cliente Exemplo F', 'VW AP 1.8 · motor completo', 'exec', 'Atrasada 2 dias', true],
      ['OS 2026-0145', 'Cliente Exemplo D', 'Ford Sigma 1.6 · motor completo', 'orc', 'Aguardando resposta há 2 dias', false],
      ['OS 2026-0139', 'Oficina Exemplo A', 'Fiat E.torQ 1.8 · cabeçote', 'exec', 'Prazo 18/11', false],
      ['OS 2026-0133', 'Cliente Exemplo G', 'Honda L15 1.5 · cabeçote', 'pronto', 'Cliente avisado', false]
    ];
    var tabsDef = [['todas', 'Todas'], ['atrasadas', 'Atrasadas'], ['analise', 'Em análise'], ['orc', 'Orçamento'], ['exec', 'Execução'], ['pronto', 'Prontas']];
    var tab = this.state.tab;
    var tabs = tabsDef.map(function (t) {
      var on = t[0] === tab;
      return { label: t[1], sel: on ? 'true' : 'false', pick: function () { self.setState({ tab: t[0] }); },
        style: 'flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #0E0E10; color: #FFFFFF; border: 1px solid #0E0E10;' : 'background: #FFFFFF; color: #111827; border: 1px solid #D1D5DB;') };
    });
    var cards = all.filter(function (c) {
      if (tab === 'todas') return true;
      if (tab === 'atrasadas') return c[5];
      return c[3] === tab;
    }).map(function (c) {
      return { num: c[0], cliente: c[1], motor: c[2], status: ST[c[3]][0], statusStyle: ST[c[3]][1], prazo: c[4], prazoColor: c[5] ? '#B91C1C' : '#4B5563' };
    });
    return { tabs: tabs, cards: cards };
  }
}
</script>
</body>
</html>
